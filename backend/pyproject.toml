[project]
name = "pizza-parlor-backend"
version = "0.1.0"
description = "Pizza parlor ordering backend — FastAPI, SQLAlchemy, Celery"
requires-python = ">=3.12"

dependencies = [
    # web
    "fastapi>=0.139",
    "uvicorn[standard]>=0.50",
    "pydantic[email]>=2.13",       # [email] provides EmailStr's validator

    # database — [asyncio] pulls greenlet, required by the async engine
    "sqlalchemy[asyncio]>=2.0.51",
    "alembic>=1.18",
    "asyncpg>=0.31",               # DATABASE_URL      (postgresql+asyncpg)
    "psycopg2-binary>=2.9",        # DATABASE_URL_SYNC (postgresql) — Celery + Alembic

    # queue — [redis] pulls the redis client used as broker and result backend
    "celery[redis]>=5.6",

    "python-dotenv>=1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",                 # FastAPI's ASGI test client
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
